name: Build and deploy style files
on:
  pull_request_target:
    types:
      - closed
  push:
    branches:
      - "release_5-4"
      - "release_6"
      - "release_7"
      - "release_8"
      - "trunk"
      - "trunk_skin_to_repo"
      - "bar"
      - "bas"

jobs:
  style-to-repo:
    if: |
      github.repository == 'daniwe4/ILIAS' &&
      ( github.event.pull_request.merged == true || github.event_name == 'push' )
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      REPO_URL: ${{ github.repositoryURL }}
    outputs:
      all: ${{ steps.changes.outputs.all }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: build and deploy
        run: CI/Style-To-Repo/build-and-deploy.sh
        with:
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}